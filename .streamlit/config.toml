# Streamlit runtime + theme configuration.
#
# The app's visual design (src/hiring_assistant/ui/theme.py) is built on light
# neutral surfaces with navy/blue accents, so the theme is pinned here rather
# than left to the viewer's OS preference — otherwise the custom CSS and the
# Streamlit chrome disagree and cards render unreadable.

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
fileWatcherType = "none"
maxUploadSize = 25

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"

[logger]
level = "warning"
