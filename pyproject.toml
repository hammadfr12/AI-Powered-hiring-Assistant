[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-powered-hiring-assistant"
version = "1.0.0"
description = "Recruiter-facing RAG assistant for evidence-grounded search and Q&A across candidate, role and hiring documents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Portfolio project" }]
keywords = ["rag", "retrieval-augmented-generation", "faiss", "streamlit", "recruitment", "nlp"]
dependencies = [
    "streamlit>=1.32,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "faiss-cpu>=1.8.0,<2.0",
    "pypdf>=4.2,<6.0",
    "python-docx>=1.1,<2.0",
    "sentence-transformers>=3.0,<6.0",
    "plotly>=5.20,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.6,<1.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --tb=short"
markers = ["slow: tests that load embedding models or build an index"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "SLF001"]
